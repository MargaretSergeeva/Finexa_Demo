<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finexa — AI-Augmented Feedback Intelligence (Interactive)</title>
<style>
  :root {
    --ink: #12172B;
    --slate: #5B6472;
    --paper: #F6F7FB;
    --line: #D7DBE3;
    --ext-tint: #EDEFF3;   --ext-accent: #7C8494;   --ext-text: #4A5262;
    --sys-tint: #FBF1DE;   --sys-accent: #B8873A;   --sys-text: #8A5A12;
    --ai-tint:  #E7ECFC;   --ai-accent:  #3355D8;   --ai-text:  #2440AD;
    --hum-tint: #E3F1E9;   --hum-accent: #1C7A4E;   --hum-text: #175E3C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink);
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    margin: 0 0 4px;
  }
  header .sub {
    font-size: 13px;
    color: var(--slate);
    letter-spacing: 0.5px;
  }
  header .hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--slate);
    font-style: italic;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .lanes {
    padding: 24px 20px;
    overflow-x: auto;
  }
  .grid-wrap {
    position: relative;
    display: inline-block;
    min-width: 100%;
  }
  .connector-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .grid {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 130px repeat(14, minmax(170px, 1fr));
    grid-auto-rows: minmax(115px, auto);
    column-gap: 56px;
    row-gap: 26px;
    min-width: 2900px;
  }
  .lane-label {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .lane-label .sub { font-size: 9.5px; font-weight: 600; opacity: 0.85; margin-top: 3px; }
  .lane-ext  { background: var(--ext-tint); color: var(--ext-text); }
  .lane-sys  { background: var(--sys-tint); color: var(--sys-text); }
  .lane-ai   { background: var(--ai-tint);  color: var(--ai-text); }
  .lane-hum  { background: var(--hum-tint); color: var(--hum-text); }

  .box {
    position: relative;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    background: #fff;
    border: 2px solid var(--line);
    transition: box-shadow 0.15s ease, transform 0.1s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .box-content { display: flex; flex-direction: column; overflow: hidden; min-width: 0; width: 100%; }
  .box:hover { box-shadow: 0 4px 14px rgba(18,23,43,0.14); transform: translateY(-1px); }
  .box.selected { box-shadow: 0 0 0 3px rgba(232,162,58,0.55), 0 4px 14px rgba(18,23,43,0.18); }
  .box .title { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .box .sub { font-size: 11px; color: var(--slate); margin-top: 4px; line-height: 1.3; }
  .box-ext  { border-color: var(--ext-accent); }
  .box-sys  { border-color: var(--sys-accent); }
  .box-ai   { border-color: var(--ai-accent); }
  .box-ai .title { color: var(--ai-text); }
  .box-sys .title { color: var(--sys-text); }
  .box-hum  {
    border-color: #14523a;
    background: repeating-linear-gradient(45deg, var(--hum-accent), var(--hum-accent) 6px, #175E3C 6px, #175E3C 11px);
    padding: 4px;
  }
  .box-hum .inner {
    background: #fff;
    border-radius: 8px;
    height: 100%;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .box-hum .title { color: var(--hum-text); }
  .box-hum-soft { border: 2px dashed var(--hum-accent) !important; background: #fff !important; padding: 12px 14px !important; }
  .box-dark { background: #1C7A4E; border-color: #1C7A4E; }
  .box-dark .title, .box-dark .sub { color: #fff; }
  .box-dark .sub { color: #DCEFE4; }

  .pill {
    margin-top: 8px;
    align-self: flex-start;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--slate);
    cursor: pointer;
  }
  .pill:hover, .pill.selected { border-color: #B8873A; color: var(--sys-text); background: #fff; }
  .box-dark .pill { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); color: #fff; }

  .step-badge {
    position: absolute;
    top: -9px;
    left: -9px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    border-top: 3px solid var(--ink);
    background: #fff;
    padding: 24px 32px 40px;
  }
  .panel-empty { color: var(--slate); font-style: italic; font-size: 14px; }
  .panel-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 12px;
    display: inline-block;
    color: #fff;
    margin-bottom: 10px;
  }
  .panel-title { font-family: Georgia, serif; font-size: 22px; margin: 0 0 10px; }
  .panel-body { font-size: 15px; line-height: 1.6; color: #33394A; max-width: 780px; }

  table.fields { border-collapse: collapse; margin-top: 6px; width: 100%; max-width: 640px; }
  table.fields th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--slate); padding: 6px 10px; border-bottom: 2px solid var(--line);
  }
  table.fields td { padding: 7px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
  table.fields td.fname { font-family: 'IBM Plex Mono', monospace; }
  table.fields td.ftype { color: var(--slate); font-style: italic; text-align: right; }
  .tag {
    font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; margin-right: 6px;
  }
  .tag-pk { background: #2451B8; }
  .tag-fk { background: #8A5A12; }

  footer { padding: 14px 32px; font-size: 11px; color: var(--slate); text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
