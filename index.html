
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finexa — AI-Augmented Feedback Intelligence (Interactive)</title>
<style>
  :root {
    --ink: #12172B;
    --slate: #5B6472;
    --paper: #F6F7FB;
    --line: #D7DBE3;
    --ext-tint: #EDEFF3;   --ext-accent: #7C8494;   --ext-text: #4A5262;
    --sys-tint: #FBF1DE;   --sys-accent: #B8873A;   --sys-text: #8A5A12;
    --ai-tint:  #E7ECFC;   --ai-accent:  #3355D8;   --ai-text:  #2440AD;
    --hum-tint: #E3F1E9;   --hum-accent: #1C7A4E;   --hum-text: #175E3C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink);
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    margin: 0 0 4px;
  }
  header .sub {
    font-size: 13px;
    color: var(--slate);
    letter-spacing: 0.5px;
  }
  header .hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--slate);
    font-style: italic;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .lanes {
    padding: 24px 20px;
    overflow-x: auto;
  }
  .grid-wrap {
    position: relative;
    display: inline-block;
    min-width: 100%;
  }
  .connector-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .grid {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 130px repeat(14, minmax(170px, 1fr));
    grid-auto-rows: minmax(115px, auto);
    column-gap: 56px;
    row-gap: 26px;
    min-width: 2900px;
  }
  .lane-label {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .lane-label .sub { font-size: 9.5px; font-weight: 600; opacity: 0.85; margin-top: 3px; }
  .lane-ext  { background: var(--ext-tint); color: var(--ext-text); }
  .lane-sys  { background: var(--sys-tint); color: var(--sys-text); }
  .lane-ai   { background: var(--ai-tint);  color: var(--ai-text); }
  .lane-hum  { background: var(--hum-tint); color: var(--hum-text); }

  .box {
    position: relative;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    background: #fff;
    border: 2px solid var(--line);
    transition: box-shadow 0.15s ease, transform 0.1s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .box-content { display: flex; flex-direction: column; overflow: hidden; min-width: 0; width: 100%; }
  .box:hover { box-shadow: 0 4px 14px rgba(18,23,43,0.14); transform: translateY(-1px); }
  .box.selected { box-shadow: 0 0 0 3px rgba(232,162,58,0.55), 0 4px 14px rgba(18,23,43,0.18); }
  .box .title { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .box .sub { font-size: 11px; color: var(--slate); margin-top: 4px; line-height: 1.3; }
  .box-ext  { border-color: var(--ext-accent); }
  .box-sys  { border-color: var(--sys-accent); }
  .box-ai   { border-color: var(--ai-accent); }
  .box-ai .title { color: var(--ai-text); }
  .box-sys .title { color: var(--sys-text); }
  .box-hum  {
    border-color: #14523a;
    background: repeating-linear-gradient(45deg, var(--hum-accent), var(--hum-accent) 6px, #175E3C 6px, #175E3C 11px);
    padding: 4px;
  }
  .box-hum .inner {
    background: #fff;
    border-radius: 8px;
    height: 100%;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .box-hum .title { color: var(--hum-text); }
  .box-hum-soft { border: 2px dashed var(--hum-accent) !important; background: #fff !important; padding: 12px 14px !important; }
  .box-dark { background: #1C7A4E; border-color: #1C7A4E; }
  .box-dark .title, .box-dark .sub { color: #fff; }
  .box-dark .sub { color: #DCEFE4; }

  .pill {
    margin-top: 8px;
    align-self: flex-start;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--slate);
    cursor: pointer;
  }
  .pill:hover, .pill.selected { border-color: #B8873A; color: var(--sys-text); background: #fff; }
  .box-dark .pill { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); color: #fff; }

  .step-badge {
    position: absolute;
    top: -9px;
    left: -9px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    border-top: 3px solid var(--ink);
    background: #fff;
    padding: 24px 32px 40px;
  }
  .panel-empty { color: var(--slate); font-style: italic; font-size: 14px; }
  .panel-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 12px;
    display: inline-block;
    color: #fff;
    margin-bottom: 10px;
  }
  .panel-title { font-family: Georgia, serif; font-size: 22px; margin: 0 0 10px; }
  .panel-body { font-size: 15px; line-height: 1.6; color: #33394A; max-width: 780px; }

  table.fields { border-collapse: collapse; margin-top: 6px; width: 100%; max-width: 640px; }
  table.fields th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--slate); padding: 6px 10px; border-bottom: 2px solid var(--line);
  }
  table.fields td { padding: 7px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
  table.fields td.fname { font-family: 'IBM Plex Mono', monospace; }
  table.fields td.ftype { color: var(--slate); font-style: italic; text-align: right; }
  .tag {
    font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; margin-right: 6px;
  }
  .tag-pk { background: #2451B8; }
  .tag-fk { background: #8A5A12; }

  footer { padding: 14px 32px; font-size: 11px; color: var(--slate); text-align: center; }
</style>
</head>
<body>
<div id="root"></div>

y",sub:"GCS \u2192 Cloud DLP \u2192 BigQuery",mono:!1,detail:"Raw files land untouched in Google Cloud Storage first \u2014 still containing personal data at this point. Cloud DLP then redacts individual names, emails, and phone numbers directly from the raw files, before any structured table exists. Only after de-identification does a structuring step parse the clean files into BigQuery. This order is never reversed.",writesTo:"raw_feedback"},{id:"process",lane:"ai",col:3,title:"/process-feedback",mono:!0,sub:"splits into distinct problems",detail:"Splits one transcript or ticket into N distinct problems \u2014 a single interview can contain several unrelated complaints. For each problem: a concise summary, pain points, root-cause indicators, a product-area tag, and a provisional theme name. Thin or unclear material triggers a needs-clarification halt instead of a confident guess.",writesTo:"processed_insights"},{id:"match",lane:"system",col:4,title:"Match Repository",sub:"vector search, confirmed insights only",mono:!1,detail:"A deterministic vector search (BigQuery VECTOR_SEARCH) compares the new insight's embedding against every already-confirmed opportunity \u2014 never against unconfirmed proposals. Returns the top matching candidates with similarity scores. This is pure math, not an LLM call \u2014 the AI never searches the canonical repository itself.",writesTo:"candidate_shortlist"},{id:"log",lane:"ai",col:5,title:"/log-feedback",mono:!0,sub:"proposes grouping",detail:"Reads only the shortlist from Match Repository \u2014 never the full repository. Judges whether this is the same issue as an existing confirmed theme, or something new. If matched, inherits the existing canonical theme name; the AI's own guess is discarded. If no match, its guess becomes the canonical name going forward.",writesTo:"logged_feedback_pending"},{id:"gate1",lane:"human",col:6,title:"GATE 1 \xB7 Marcus",mono:!0,gate:!0,sub:"approves grouping",detail:"Marcus reviews the proposed grouping alongside the top matching candidates and their similarity scores \u2014 he verifies, he doesn't just trust the AI's read. Accept, Edit, or Reject. Nothing is promoted to the permanent record without his decision. If the matched opportunity's linked Jira ticket already shows a confirmed 'resolved' status, this screen flags a possible regression. This is a verification task \u2014 a sustained agreement rate here is real evidence it could eventually move to spot-checks.",writesTo:"insight_repository"},{id:"score",lane:"system",col:7,title:"Score Opportunity",sub:"5-factor formula, reproducible",mono:!1,detail:"A deterministic BigQuery formula \u2014 never the LLM \u2014 computes the priority score from five inputs: customer value (Enterprise vs. SMB merchants affected), urgency (worst severity reported plus how often it recurs), strategic alignment, operational risk, and compliance sensitivity. Implementation complexity is deliberately excluded \u2014 there's no reliable signal to estimate it from before a real draft exists.",writesTo:"insight_repository"},{id:"prioritize",lane:"ai",col:8,title:"/prioritize-opportunities",mono:!0,sub:"explains the score",detail:"Reads the already-computed priority score and writes a plain-language explanation of what drove it. It never calculates the number itself \u2014 the arithmetic happens entirely in Score Opportunity, one step earlier.",writesTo:"insight_repository"},{id:"gate2",lane:"human",col:9,title:"GATE 2 \xB7 Marcus",mono:!0,gate:!0,sub:"approves to draft",detail:"Marcus confirms this specific scored opportunity is worth spending engineering drafting effort on right now. This is a judgment call, not a re-check of the grouping \u2014 by this point the item is already validated and scored; the question is timing and priority, which shifts week to week. Because there's no single correct answer here for an agreement rate to converge toward, this gate never graduates to spot-checks.",writesTo:"insight_repository"},{id:"draft",lane:"ai",col:10,title:"/draft-user-story",mono:!0,sub:"drafts the ticket",detail:"Invoked by Priya's team, not Marcus \u2014 this is engineering's action. Converts a Gate-2-approved opportunity into a complete draft: problem statement, user story, acceptance criteria, assumptions and dependencies, and suggested labels, with rationale linked back to the original customer evidence.",writesTo:"jira_tickets"},{id:"gate3",lane:"human",col:11,title:"GATE 3 \xB7 Priya",mono:!0,gate:!0,sub:"confirms + estimates",detail:"Priya reviews the draft beside the original opportunity evidence \u2014 not the draft alone \u2014 to catch anything that drifted from what the customer actually said. She assigns complexity here, in story points, as ordinary grooming rather than a separate process. Also a judgment task with no automated signal to check it against, so it never graduates either.",writesTo:"jira_tickets"},{id:"backlog",lane:"human",col:12,title:"Backlog Selection",soft:!0,sub:"chooses sprint items",mono:!1,detail:"Priya or other stakeholders, before each sprint, choose which already-confirmed drafts actually go out now. A scheduling decision, separate from Gate 3's quality check \u2014 not a formal Accept/Edit/Reject gate, just a selection.",writesTo:"jira_tickets"},{id:"publish",lane:"system",col:13,title:"Publish",sub:"wrapper code \u2192 Jira API",mono:!1,detail:"The deterministic Wrapper Code \u2014 the only component holding Jira credentials \u2014 calls Jira's API. The POST is synchronous: only on confirmed success does the status update, so a failed call never silently loses the fact that something was selected.",writesTo:"Jira Ticket"},{id:"jira",lane:"external",col:14,title:"Jira",dark:!0,mono:!0,sub:"ticket live, evidence linked",detail:"The real ticket now exists in Jira, with its key written back and linked to the full BigQuery evidence chain \u2014 fully traceable from the ticket back to the original customer feedback that produced it.",writesTo:null}],Av={raw_feedback:{note:null,fields:[{n:"raw_feedback_id",t:"STRING",pk:1},{n:"source_type",t:"ENUM"},{n:"merchant_id",t:"\u2192 merchants",fk:1},{n:"raw_text",t:"STRING"},{n:"created_at",t:"TIMESTAMP"}]},processed_insights:{note:"Permanent \u2014 never deleted. Each insight keeps its own severity, segment, and account tier.",fields:[{n:"insight_id",t:"STRING",pk:1},{n:"source_id",t:"\u2192 raw_feedback",fk:1},{n:"summary",t:"STRING"},{n:"pain_points",t:"STRING"},{n:"root_cause",t:"STRING"},{n:"product_area_tag",t:"ENUM"},{n:"suggested_theme",t:"STRING"},{n:"embedding",t:"VECTOR"},{n:"severity",t:"ENUM"},{n:"segment",t:"STRING"},{n:"account_tier",t:"ENUM"},{n:"opportunity_id",t:"\u2192 insight_repository",fk:1}]},candidate_shortlist:{note:null,fields:[{n:"shortlist_id",t:"STRING",pk:1},{n:"insight_id",t:"\u2192 processed_insights",fk:1},{n:"matched_opportunity_id",t:"\u2192 insight_repository",fk:1},{n:"similarity_score",t:"FLOAT"}]},logged_feedback_pending:{note:"The AI's proposal, awaiting Gate 1 \u2014 nothing here is final yet.",fields:[{n:"pending_id",t:"STRING",pk:1},{n:"insight_id",t:"\u2192 processed_insights",fk:1},{n:"proposed_theme",t:"STRING"},{n:"proposed_segment",t:"STRING"},{n:"proposed_workflow",t:"STRING"},{n:"proposed_severity",t:"ENUM"},{n:"proposed_feature_area",t:"ENUM"},{n:"account_tier",t:"ENUM"},{n:"status",t:"ENUM"}]},insight_repository:{note:"\u2605 Canonical. The opportunity/theme \u2014 not the insight. Fields below are sticky, set once, or computed.",fields:[{n:"opportunity_id",t:"STRING",pk:1},{n:"theme",t:"sticky"},{n:"workflow",t:"sticky"},{n:"feature_area",t:"ENUM \xB7 sticky"},{n:"priority_score",t:"FLOAT"},{n:"priority_explanation",t:"STRING"},{n:"approved_for_drafting",t:"BOOLEAN"},{n:"status",t:"ENUM (\u2026/sent/resolved)"}]},jira_tickets:{note:"One consolidated table \u2014 draft content and, once sent, Jira's own key and cached status.",fields:[{n:"ticket_id",t:"STRING",pk:1},{n:"opportunity_id",t:"\u2192 insight_repository",fk:1},
