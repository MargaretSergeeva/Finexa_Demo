<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finexa — AI-Augmented Feedback Intelligence (Interactive)</title>
<style>
  :root {
    --ink: #12172B;
    --slate: #5B6472;
    --paper: #F6F7FB;
    --line: #D7DBE3;
    --ext-tint: #EDEFF3;   --ext-accent: #7C8494;   --ext-text: #4A5262;
    --sys-tint: #FBF1DE;   --sys-accent: #B8873A;   --sys-text: #8A5A12;
    --ai-tint:  #E7ECFC;   --ai-accent:  #3355D8;   --ai-text:  #2440AD;
    --hum-tint: #E3F1E9;   --hum-accent: #1C7A4E;   --hum-text: #175E3C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--ink);
  }
  .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    margin: 0 0 4px;
  }
  header .sub {
    font-size: 13px;
    color: var(--slate);
    letter-spacing: 0.5px;
  }
  header .hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--slate);
    font-style: italic;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .lanes {
    padding: 24px 20px;
    overflow-x: auto;
  }
  .grid-wrap {
    position: relative;
    display: inline-block;
    min-width: 100%;
  }
  .connector-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .grid {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 130px repeat(14, minmax(170px, 1fr));
    grid-auto-rows: minmax(115px, auto);
    column-gap: 56px;
    row-gap: 26px;
    min-width: 2900px;
  }
  .lane-label {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .lane-label .sub { font-size: 9.5px; font-weight: 600; opacity: 0.85; margin-top: 3px; }
  .lane-ext  { background: var(--ext-tint); color: var(--ext-text); }
  .lane-sys  { background: var(--sys-tint); color: var(--sys-text); }
  .lane-ai   { background: var(--ai-tint);  color: var(--ai-text); }
  .lane-hum  { background: var(--hum-tint); color: var(--hum-text); }

  .box {
    position: relative;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    background: #fff;
    border: 2px solid var(--line);
    transition: box-shadow 0.15s ease, transform 0.1s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .box-content { display: flex; flex-direction: column; overflow: hidden; min-width: 0; width: 100%; }
  .box:hover { box-shadow: 0 4px 14px rgba(18,23,43,0.14); transform: translateY(-1px); }
  .box.selected { box-shadow: 0 0 0 3px rgba(232,162,58,0.55), 0 4px 14px rgba(18,23,43,0.18); }
  .box .title { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .box .sub { font-size: 11px; color: var(--slate); margin-top: 4px; line-height: 1.3; }
  .box-ext  { border-color: var(--ext-accent); }
  .box-sys  { border-color: var(--sys-accent); }
  .box-ai   { border-color: var(--ai-accent); }
  .box-ai .title { color: var(--ai-text); }
  .box-sys .title { color: var(--sys-text); }
  .box-hum  {
    border-color: #14523a;
    background: repeating-linear-gradient(45deg, var(--hum-accent), var(--hum-accent) 6px, #175E3C 6px, #175E3C 11px);
    padding: 4px;
  }
  .box-hum .inner {
    background: #fff;
    border-radius: 8px;
    height: 100%;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .box-hum .title { color: var(--hum-text); }
  .box-hum-soft { border: 2px dashed var(--hum-accent) !important; background: #fff !important; padding: 12px 14px !important; }
  .box-dark { background: #1C7A4E; border-color: #1C7A4E; }
  .box-dark .title, .box-dark .sub { color: #fff; }
  .box-dark .sub { color: #DCEFE4; }

  .pill {
    margin-top: 8px;
    align-self: flex-start;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--slate);
    cursor: pointer;
  }
  .pill:hover, .pill.selected { border-color: #B8873A; color: var(--sys-text); background: #fff; }
  .box-dark .pill { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); color: #fff; }

  .step-badge {
    position: absolute;
    top: -9px;
    left: -9px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel {
    border-top: 3px solid var(--ink);
    background: #fff;
    padding: 24px 32px 40px;
  }
  .panel-empty { color: var(--slate); font-style: italic; font-size: 14px; }
  .panel-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 12px;
    display: inline-block;
    color: #fff;
    margin-bottom: 10px;
  }
  .panel-title { font-family: Georgia, serif; font-size: 22px; margin: 0 0 10px; }
  .panel-body { font-size: 15px; line-height: 1.6; color: #33394A; max-width: 780px; }

  table.fields { border-collapse: collapse; margin-top: 6px; width: 100%; max-width: 640px; }
  table.fields th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--slate); padding: 6px 10px; border-bottom: 2px solid var(--line);
  }
  table.fields td { padding: 7px 10px; font-size: 13px; border-bottom: 1px solid var(--line); }
  table.fields td.fname { font-family: 'IBM Plex Mono', monospace; }
  table.fields td.ftype { color: var(--slate); font-style: italic; text-align: right; }
  .tag {
    font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; margin-right: 6px;
  }
  .tag-pk { background: #2451B8; }
  .tag-fk { background: #8A5A12; }

  footer { padding: 14px 32px; font-size: 11px; color: var(--slate); text-align: center; }
</style>
</head>
<body>
<div id="root"></div>

<script>
window.STEPS_DATA = [
  {
    id: "step-1",
    num: 1,
    lane: "sys",
    col: 1,
    row: 2,
    title: "1. Feedback Ingestion",
    sub: "DLP Scrub → Raw Feedback",
    table: "raw_feedbacks",
    desc: "Ingests raw feedback across 6 channels (support tickets, sales notes, transcripts, etc.). Runs Cloud DLP de-identification before reaching the LLM."
  },
  {
    id: "step-2",
    num: 2,
    lane: "ai",
    col: 2,
    row: 3,
    title: "2. /process-feedback",
    sub: "LLM Deconstruction",
    table: "processed_insights",
    desc: "Splits raw feedback into atomic insights, categorizing problem details, root cause, and pain points while extracting ENUM tags."
  },
  {
    id: "step-3",
    num: 3,
    lane: "ai",
    col: 3,
    row: 3,
    title: "3. /log-feedback",
    sub: "RAG Similarity Match",
    table: "opportunity_insights",
    desc: "Executes vector search against vector embeddings to evaluate whether this insight maps to an already-confirmed insight in the repository or constitutes a new opportunity. Matches are collapsed to their parent opportunity and ranked by best-matching insight score, returning the top candidates with their similarity scores."
  },
  {
    id: "step-4",
    num: 4,
    lane: "hum",
    col: 4,
    row: 4,
    title: "4. Gate 1 (PM)",
    sub: "Verification & Linking",
    table: "gate_decisions",
    desc: "Human verification gate. PM validates atomic splits, ENUM tags, and confirms whether to link to an existing candidate opportunity or establish a new one."
  },
  {
    id: "step-5",
    num: 5,
    lane: "sys",
    col: 5,
    row: 2,
    title: "5. Score Opportunity",
    sub: "Deterministic Formula",
    table: "opportunity_priority_metrics",
    desc: "Calculates a composite priority score deterministically using weighted inputs: customer impact, severity mix, urgency, strategic alignment, and compliance risk."
  },
  {
    id: "step-6",
    num: 6,
    lane: "ai",
    col: 6,
    row: 3,
    title: "6. /prioritize-opportunities",
    sub: "LLM Explanation",
    table: "opportunities",
    desc: "Reads the deterministically computed priority score and generates a clear, evidence-backed narrative explanation of why this item ranked high or low."
  },
  {
    id: "step-7",
    num: 7,
    lane: "hum",
    col: 7,
    row: 4,
    title: "7. Gate 2 (PM)",
    sub: "Strategic Approval",
    table: "gate_decisions",
    desc: "PM judgment gate. Evaluates scored opportunities against current roadmap capacity and strategic priorities to select items ready for story drafting."
  },
  {
    id: "step-8",
    num: 8,
    lane: "ai",
    col: 8,
    row: 3,
    title: "8. /draft-user-story",
    sub: "Payload Generation",
    table: "jira_drafts",
    desc: "Generates structured Jira user story payloads including problem statement, user story, acceptance criteria, and suggested story point complexity."
  },
  {
    id: "step-9",
    num: 9,
    lane: "hum",
    col: 9,
    row: 4,
    title: "9. Gate 3 (Eng)",
    sub: "Engineering Sign-off",
    table: "gate_decisions",
    desc: "Engineering Lead review gate. Validates acceptance criteria completeness, verifies technical feasibility, and confirms or overrides story point complexity."
  },
  {
    id: "step-10",
    num: 10,
    lane: "sys",
    col: 10,
    row: 2,
    title: "10. Jira Dispatch",
    sub: "Deterministic Wrapper",
    table: "jira_drafts",
    desc: "Wrapper script executes API call to create official Jira issues once Gate 3 sign-off is logged, ensuring complete separation of LLM core from Jira credentials."
  },
  {
    id: "step-11",
    num: 11,
    lane: "ext",
    col: 11,
    row: 1,
    title: "11. Jira Sync",
    sub: "Webhook/API Return",
    table: "jira_drafts",
    desc: "Receives official Jira key, status updates, and release fix versions back into BigQuery to maintain continuous lineage and enable regression tracking."
  },
  {
    id: "step-12",
    num: 12,
    lane: "ai",
    col: 12,
    row: 3,
    title: "12. /ask_data",
    sub: "MCP Conversational Agent",
    table: "mcp_audit_logs",
    desc: "Parallel read-only agent powered by Model Context Protocol (MCP) allowing stakeholders to run natural language queries across feedback and pipeline analytics."
  }
];

window.TABLES_DATA = {
  raw_feedbacks: {
    title: "raw_feedbacks",
    desc: "Stores ingested feedback data across all 6 channels prior to AI processing.",
    fields: [
      { name: "feedback_id", type: "STRING", pk: true },
      { name: "channel", type: "ENUM" },
      { name: "raw_text_deidentified", type: "STRING" },
      { name: "merchant_id", type: "STRING" },
      { name: "merchant_account_tier", type: "ENUM" },
      { name: "created_at", type: "TIMESTAMP" }
    ]
  },
  processed_insights: {
    title: "processed_insights",
    desc: "Deconstructed atomic problem statements extracted by /process-feedback.",
    fields: [
      { name: "insight_id", type: "STRING", pk: true },
      { name: "feedback_id", type: "STRING", fk: true },
      { name: "summary", type: "STRING" },
      { name: "workflow", type: "ENUM" },
      { name: "feature_area", type: "ENUM" },
      { name: "severity", type: "ENUM" },
      { name: "urgency", type: "ENUM" },
      { name: "embedding", type: "VECTOR" }
    ]
  },
  opportunity_insights: {
    title: "opportunity_insights",
    desc: "Junction table mapping atomic insights to canonical opportunities.",
    fields: [
      { name: "opportunity_id", type: "STRING", pk: true, fk: true },
      { name: "insight_id", type: "STRING", pk: true, fk: true },
      { name: "similarity_score", type: "FLOAT" },
      { name: "linked_at", type: "TIMESTAMP" }
    ]
  },
  opportunities: {
    title: "opportunities",
    desc: "Canonical grouped opportunities representing recurring issues.",
    fields: [
      { name: "opportunity_id", type: "STRING", pk: true },
      { name: "title", type: "STRING" },
      { name: "status", type: "ENUM" },
      { name: "score_explanation", type: "STRING" },
      { name: "regression_flag", type: "BOOLEAN" },
      { name: "last_insight_at", type: "TIMESTAMP" }
    ]
  },
  opportunity_priority_metrics: {
    title: "opportunity_priority_metrics",
    desc: "Deterministic mathematical inputs and total weighted priority score.",
    fields: [
      { name: "opportunity_id", type: "STRING", pk: true, fk: true },
      { name: "customer_value_score", type: "FLOAT" },
      { name: "severity_score", type: "FLOAT" },
      { name: "urgency_score", type: "FLOAT" },
      { name: "strategic_alignment_score", type: "FLOAT" },
      { name: "compliance_risk_score", type: "FLOAT" },
      { name: "final_priority_score", type: "FLOAT" }
    ]
  },
  jira_drafts: {
    title: "jira_drafts",
    desc: "Pre-drafted user stories and engineering complexity estimates.",
    fields: [
      { name: "draft_id", type: "STRING", pk: true },
      { name: "opportunity_id", type: "STRING", fk: true },
      { name: "title", type: "STRING" },
      { name: "problem_statement", type: "STRING" },
      { name: "user_story", type: "STRING" },
      { name: "acceptance_criteria", type: "JSON" },
      { name: "ai_suggested_points", type: "INTEGER" },
      { name: "confirmed_points", type: "INTEGER" },
      { name: "jira_ticket_key", type: "STRING" },
      { name: "sync_status", type: "ENUM" }
    ]
  },
  gate_decisions: {
    title: "gate_decisions",
    desc: "Audit trail logging human approval, modification, or rejection across Gates 1-3.",
    fields: [
      { name: "decision_id", type: "STRING", pk: true },
      { name: "gate_name", type: "ENUM" },
      { name: "entity_id", type: "STRING" },
      { name: "action", type: "ENUM" },
      { name: "reviewer_role", type: "STRING" },
      { name: "ai_proposed_value", type: "JSON" },
      { name: "pm_final_value", type: "JSON" },
      { name: "decided_at", type: "TIMESTAMP" }
    ]
  },
  mcp_audit_logs: {
    title: "mcp_audit_logs",
    desc: "Read-only logs tracking natural language queries processed by /ask_data.",
    fields: [
      { name: "query_id", type: "STRING", pk: true },
      { name: "user_role", type: "STRING" },
      { name: "prompt_text", type: "STRING" },
      { name: "sql_executed", type: "STRING" },
      { name: "executed_at", type: "TIMESTAMP" }
    ]
  }
};
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function App() {
  const [selectedStepId, setSelectedStepId] = useState("step-1");
  const [lines, setLines] = useState([]);
  const gridWrapRef = useRef(null);

  const steps = window.STEPS_DATA || [];
  const tables = window.TABLES_DATA || {};

  const currentStep = steps.find(s => s.id === selectedStepId);
  const currentTable = currentStep && currentStep.table ? tables[currentStep.table] : null;

  const updateConnectors = () => {
    if (!gridWrapRef.current) return;
    const wrapRect = gridWrapRef.current.getBoundingClientRect();
    const newLines = [];

    for (let i = 0; i < steps.length - 1; i++) {
      const fromEl = document.getElementById(`box-${steps[i].id}`);
      const toEl = document.getElementById(`box-${steps[i+1].id}`);

      if (fromEl && toEl) {
        const r1 = fromEl.getBoundingClientRect();
        const r2 = toEl.getBoundingClientRect();

        const x1 = r1.right - wrapRect.left;
        const y1 = r1.top + r1.height / 2 - wrapRect.top;
        const x2 = r2.left - wrapRect.left;
        const y2 = r2.top + r2.height / 2 - wrapRect.top;

        const dx = x2 - x1;
        const path = `M ${x1} ${y1} C ${x1 + dx/2} ${y1}, ${x1 + dx/2} ${y2}, ${x2} ${y2}`;
        newLines.push({ id: `line-${i}`, path });
      }
    }
    setLines(newLines);
  };

  useEffect(() => {
    updateConnectors();
    window.addEventListener("resize", updateConnectors);
    return () => window.removeEventListener("resize", updateConnectors);
  }, []);

  return (
    <div className="app">
      <header>
        <h1>Finexa — AI-Augmented Feedback Intelligence</h1>
        <div className="sub">Interactive Architectural & Operational Process Diagram</div>
        <div className="hint">Click any process step to inspect step details and its corresponding database table schema.</div>
      </header>

      <div className="main">
        <div className="lanes">
          <div className="grid-wrap" ref={gridWrapRef}>
            <svg className="connector-svg">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--slate)" />
                </marker>
              </defs>
              {lines.map(l => (
                <path key={l.id} d={l.path} fill="none" stroke="var(--line)" strokeWidth="2" strokeDasharray="4 4" markerEnd="url(#arrow)" />
              ))}
            </svg>

            <div className="grid">
              <div className="lane-label lane-ext" style={{ gridRow: 1 }}>
                EXTERNAL
                <span className="sub">Jira / Core DB</span>
              </div>
              <div className="lane-label lane-sys" style={{ gridRow: 2 }}>
                SYSTEM / DETERMINISTIC
                <span className="sub">Appsmith / Pipelines</span>
              </div>
              <div className="lane-label lane-ai" style={{ gridRow: 3 }}>
                AI / COGNITIVE
                <span className="sub">LLM / Vector / MCP</span>
              </div>
              <div className="lane-label lane-hum" style={{ gridRow: 4 }}>
                HUMAN DECISION
                <span className="sub">Gate 1 - Gate 3</span>
              </div>

              {steps.map((step) => {
                const isSelected = selectedStepId === step.id;
                let boxClass = `box box-${step.lane}`;
                if (step.lane === "hum") boxClass += " box-hum-soft";
                if (isSelected) boxClass += " selected";

                return (
                  <div
                    key={step.id}
                    id={`box-${step.id}`}
                    className={boxClass}
                    style={{ gridColumn: step.col + 1, gridRow: step.row }}
                    onClick={() => setSelectedStepId(step.id)}
                  >
                    <div className="step-badge">{step.num}</div>
                    <div className="box-content">
                      <div className="title">{step.title}</div>
                      <div className="sub">{step.sub}</div>
                      {step.table && (
                        <div className={`pill ${isSelected ? "selected" : ""}`}>
                          → {step.table}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="panel">
          {currentStep && (
            <div>
              <div
                className="panel-eyebrow"
                style={{
                  background:
                    currentStep.lane === "ai"
                      ? "var(--ai-accent)"
                      : currentStep.lane === "sys"
                      ? "var(--sys-accent)"
                      : currentStep.lane === "hum"
                      ? "var(--hum-accent)"
                      : "var(--ext-accent)"
                }}
              >
                {currentStep.lane.toUpperCase()} STEP {currentStep.num}
              </div>
              <h2 className="panel-title">{currentStep.title}</h2>
              <div className="panel-body">{currentStep.desc}</div>

              {currentTable && (
                <div style={{ marginTop: "24px" }}>
                  <h3 style={{ fontSize: "16px", margin: "0 0 6px" }}>
                    Table Schema: <span className="mono" style={{ color: "var(--sys-text)" }}>{currentTable.title}</span>
                  </h3>
                  <p style={{ fontSize: "13px", color: "var(--slate)", margin: "0 0 12px" }}>{currentTable.desc}</p>
                  <table className="fields">
                    <thead>
                      <tr>
                        <th>Field Name</th>
                        <th style={{ textAlign: "right" }}>Data Type</th>
                      </tr>
                    </thead>
                    <tbody>
                      {currentTable.fields.map((f, idx) => (
                        <tr key={idx}>
                          <td className="fname">
                            {f.pk && <span className="tag tag-pk">PK</span>}
                            {f.fk && <span className="tag tag-fk">FK</span>}
                            {f.name}
                          </td>
                          <td className="ftype">{f.type}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      <footer>
        Finexa Merchant Experience Product Group — Payments Pilot Interactive Process Map
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
